<!doctype html>
<!--
  GAMEPLAY — overlay principal, FONDO TRANSPARENTE.
  OBS: Fuente de navegador, archivo local, 1920 × 1080, encima de la captura.
  Textos: config/partida.js (jugadores, marcador, ronda) y config/evento.js.
  Zonas libres a propósito: franja inferior central (porcentajes y stocks)
  y esquina superior derecha (temporizador).
  Con cámaras de jugadores (evento.gameplay.camaras = true; activado en Center Stage),
  las cámaras van DEBAJO de esta fuente, recortadas a 16:9:
    Cámara jugador 1: x 24,   y 836, 320 × 180   (abajo a la izquierda)
    Cámara jugador 2: x 1576, y 836, 320 × 180   (abajo a la derecha)
-->
<html lang="es" data-tema="smash-hub">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Gameplay · Smash Hub</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/temas/center-stage.css" />
    <link rel="stylesheet" href="assets/css/gameplay.css" />
    <link rel="stylesheet" href="assets/css/broadcast.css" />
  </head>
  <body>
    <main class="escena escena-gameplay">
      <!-- Marcador -->
      <section class="marcador entra" aria-label="Marcador">
        <div class="lado lado-1" data-jugador="1">
          <div class="placa">
            <span class="placa-texto" data-ajustar="0.55">
              <img class="bandera" data-bandera="1" alt="" />
              <span class="equipo" data-campo="partida.jugador1.equipo"></span>
              <span class="nombre" data-campo="partida.jugador1.nombre"></span>
            </span>
          </div>
          <div class="puntos"><span data-campo="partida.jugador1.marcador"></span></div>
        </div>

        <div class="centro">
          <span class="ronda" data-campo="partida.ronda" data-ajustar="0.6"></span>
        </div>

        <div class="lado lado-2" data-jugador="2">
          <div class="puntos"><span data-campo="partida.jugador2.marcador"></span></div>
          <div class="placa">
            <span class="placa-texto" data-ajustar="0.55">
              <img class="bandera" data-bandera="2" alt="" />
              <span class="equipo" data-campo="partida.jugador2.equipo"></span>
              <span class="nombre" data-campo="partida.jugador2.nombre"></span>
            </span>
          </div>
        </div>
      </section>

      <div class="pestana entra" style="--retraso: 0.15s">
        <span class="formato" data-campo="partida.formato"></span>
        <i></i>
        <span class="pestana-evento" data-campo="partida.contexto" data-ajustar="0.6"></span>
      </div>

      <!-- Cámaras de jugadores en las esquinas inferiores (opcional) -->
      <section class="cams-gameplay" aria-label="Cámaras de jugadores">
        <div class="cam-esquina cam-esquina-1 entra-izq" style="--retraso: 0.3s" data-jugador="1">
          <div class="hueco hueco-esquina"><i class="esq esq-1"></i><i class="esq esq-2"></i><i class="esq esq-3"></i><i class="esq esq-4"></i></div>
          <div class="cam-placa">
            <img class="bandera" data-bandera="1" alt="" />
            <span class="cam-nombre display" data-campo="partida.jugador1.nombre" data-ajustar="0.55"></span>
            <span class="cam-puntos display" data-campo="partida.jugador1.marcador"></span>
          </div>
        </div>
        <div class="cam-esquina cam-esquina-2 entra-der" style="--retraso: 0.3s" data-jugador="2">
          <div class="hueco hueco-esquina"><i class="esq esq-1"></i><i class="esq esq-2"></i><i class="esq esq-3"></i><i class="esq esq-4"></i></div>
          <div class="cam-placa">
            <img class="bandera" data-bandera="2" alt="" />
            <span class="cam-nombre display" data-campo="partida.jugador2.nombre" data-ajustar="0.55"></span>
            <span class="cam-puntos display" data-campo="partida.jugador2.marcador"></span>
          </div>
        </div>
      </section>

      <!-- Marca (abajo a la izquierda) -->
      <section class="bug entra-izq" style="--retraso: 0.3s" aria-label="Evento">
        <img class="logo-club" data-src="evento.logoClub" alt="" width="92" height="92" />
        <img class="logo-evento" data-src="evento.logoEvento" alt="" width="92" height="92" />
        <div class="bug-panel">
          <img class="logo-evento-h bug-logo-h" data-src="evento.logoEventoHorizontal" alt="" height="40" />
          <span class="bug-evento display" data-campo="evento.evento" data-ajustar="0.6"></span>
          <span class="bug-sub" data-ajustar="0.7"
            ><span data-campo="evento.organizacion"></span> · <span data-campo="evento.sitio"></span
          ></span>
        </div>
      </section>

      <!-- Patrocinadores (abajo a la derecha), rotan cada 8 s -->
      <section class="auspicio entra-der" style="--retraso: 0.4s" aria-label="Patrocinadores">
        <span class="auspicio-etiqueta">Con el apoyo de</span>
        <div class="auspicio-logos" data-lista="todos" data-rotar="8"></div>
      </section>
    </main>
    <script src="assets/js/overlay.js"></script>
  </body>
</html>

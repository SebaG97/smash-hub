# TEMPLATE: replace REPLACE_* fields after confirming existing resources.
# Never submit this template to create/update an app without review.
name: smash-py-hub
services:
  - name: web
    github:
      repo: SebaG97/smash-hub
      branch: main
      deploy_on_push: false
    source_dir: /apps/web
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run start -- --port 3000
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: /api/v1
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"
  - name: api
    github:
      repo: SebaG97/smash-hub
      branch: main
      deploy_on_push: false
    source_dir: /apps/api
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: python -m app.runtime
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/v1/health/ready
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${hub-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${hub-db.CA_CERT}
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: '["${APP_URL}"]'
      - key: DB_POOL_SIZE
        scope: RUN_TIME
        value: "3"
      - key: DB_MAX_OVERFLOW
        scope: RUN_TIME
        value: "2"
      # Mission 05 secrets: set their values in the control panel, never in Git.
      # Legacy shared admin key (ADR-011), transition only (ADR-021): it works only
      # while ADMIN_TOKEN_EXPIRES (ISO date with time zone, <= 90 days ahead) is in the
      # future. Delete both once every organizer signs in with their own account.
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_TOKEN_EXPIRES
        scope: RUN_TIME
      # Read-only use: seeding data refresh. Pushing seeds to start.gg stays CLI-only.
      - key: STARTGG_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Background copy of start.gg into PostgreSQL (ADR-022): runs inside this service,
      # no extra component. Set to "true" once migration 0022 is applied. Frequencies and
      # limits: docs/operations/startgg-sync.md (STARTGG_SYNC_*; defaults fit one instance).
      - key: STARTGG_SYNC_ENABLED
        scope: RUN_TIME
        value: "false"
      # App Platform's ingress puts the visitor's IP here (X-Forwarded-For carries the
      # ingress's own address). Used for sign-in throttling and the audit (ADR-021).
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: do-connecting-ip
databases:
  - name: hub-db
    engine: PG
    production: true
    cluster_name: REPLACE_EXISTING_CLUSTER_NAME
    db_name: REPLACE_EXISTING_DATABASE_NAME
    db_user: REPLACE_LIMITED_APP_USER
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: smashhub_test
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: isolated_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_owner -d smashhub_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_owner:isolated_test_only@localhost:5432/smashhub_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet
      - uses: digitalocean/action-doctl@v2
        with:
          version: "2.0.0"
          no_auth: "true"
      - run: doctl apps spec validate --schema-only infra/digitalocean/app.yaml
      - run: python scripts/combine_app_spec.py > /tmp/app-with-migration.yaml
      - run: doctl apps spec validate --schema-only /tmp/app-with-migration.yaml

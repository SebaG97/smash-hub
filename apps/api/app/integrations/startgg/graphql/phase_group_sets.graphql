query PhaseGroupSets($id: ID!, $page: Int!, $perPage: Int!) {
  phaseGroup(id: $id) {
    id
    sets(page: $page, perPage: $perPage, sortType: STANDARD) {
      pageInfo { total totalPages }
      nodes {
        id round fullRoundText
        slots { prereqId prereqType prereqPlacement seed { seedNum } }
      }
    }
  }
}
